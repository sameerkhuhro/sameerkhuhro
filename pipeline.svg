<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Roadmap: Linux, Red Hat Linux, Docker done. CI/CD and Azure in progress. Goal: DevOps Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#120e2e"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.06"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="5s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="270" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="270" fill="url(#bg)"/>
    <rect width="1200" height="270" fill="url(#grid)"/>

    <text x="600" y="38" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="14" letter-spacing="4" fill="#64748b">MY DEVOPS ROADMAP</text>

    <!-- track -->
    <path d="M110 120 H1085" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <!-- done (green) -->
    <path d="M110 120 H500" stroke="#22c55e" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <!-- in progress (blue, flowing) -->
    <path d="M500 120 H890" stroke="#38bdf8" stroke-width="6" stroke-dasharray="14 12" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- goal (purple, flowing) -->
    <path d="M890 120 H1085" stroke="#c084fc" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.2s" repeatCount="indefinite"/>
    </path>

    <!-- travelling packet -->
    <circle r="7" fill="#fff" filter="url(#glow)">
      <animateMotion path="M110 120 H1085" dur="6s" repeatCount="indefinite"/>
    </circle>

    <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">

      <!-- 1 Linux -->
      <circle cx="110" cy="120" r="34" fill="#052e1a" stroke="#22c55e" stroke-width="3" filter="url(#glow)"/>
      <path d="M96 121 l10 10 l19 -21" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="187" font-size="19" font-weight="700" fill="#e2e8f0">Linux</text>
      <text x="110" y="209" font-size="12" font-weight="700" letter-spacing="2" fill="#4ade80">DONE</text>

      <!-- 2 Red Hat -->
      <circle cx="305" cy="120" r="34" fill="#052e1a" stroke="#22c55e" stroke-width="3" filter="url(#glow)"/>
      <path d="M291 121 l10 10 l19 -21" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="305" y="187" font-size="19" font-weight="700" fill="#e2e8f0">Red Hat Linux</text>
      <text x="305" y="209" font-size="12" font-weight="700" letter-spacing="2" fill="#4ade80">DONE</text>

      <!-- 3 Docker -->
      <circle cx="500" cy="120" r="34" fill="#052e1a" stroke="#22c55e" stroke-width="3" filter="url(#glow)"/>
      <path d="M486 121 l10 10 l19 -21" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="500" y="187" font-size="19" font-weight="700" fill="#e2e8f0">Docker</text>
      <text x="500" y="209" font-size="12" font-weight="700" letter-spacing="2" fill="#4ade80">DONE</text>

      <!-- 4 CI/CD (now) -->
      <circle cx="695" cy="120" r="34" fill="none" stroke="#38bdf8" stroke-width="2">
        <animate attributeName="r" values="34;60" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="695" cy="120" r="34" fill="#0c2a44" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
      <path d="M686 105 L708 120 L686 135 Z" fill="#7dd3fc">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <text x="695" y="187" font-size="19" font-weight="700" fill="#e2e8f0">CI/CD</text>
      <text x="695" y="209" font-size="12" font-weight="700" letter-spacing="2" fill="#38bdf8">IN PROGRESS</text>

      <!-- 5 Azure (now) -->
      <circle cx="890" cy="120" r="34" fill="none" stroke="#38bdf8" stroke-width="2">
        <animate attributeName="r" values="34;60" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="890" cy="120" r="34" fill="#0c2a44" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
      <path d="M881 105 L903 120 L881 135 Z" fill="#7dd3fc">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
      </path>
      <text x="890" y="187" font-size="19" font-weight="700" fill="#e2e8f0">Azure</text>
      <text x="890" y="209" font-size="12" font-weight="700" letter-spacing="2" fill="#38bdf8">IN PROGRESS</text>

      <!-- 6 Goal -->
      <circle cx="1085" cy="120" r="34" fill="none" stroke="#c084fc" stroke-width="2">
        <animate attributeName="r" values="34;62" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1085" cy="120" r="34" fill="#1e1b4b" stroke="#c084fc" stroke-width="3" filter="url(#glow)"/>
      <path d="M1085 100 l6.5 13.5 l14.5 2 l-10.5 10 l2.6 14.5 l-13.1 -7 l-13.1 7 l2.6 -14.5 l-10.5 -10 l14.5 -2 Z" fill="#e9d5ff">
        <animateTransform attributeName="transform" type="rotate" from="0 1085 120" to="360 1085 120" dur="8s" repeatCount="indefinite"/>
      </path>
      <text x="1085" y="187" font-size="19" font-weight="700" fill="#f5d0fe">DevOps Engineer</text>
      <text x="1085" y="209" font-size="12" font-weight="700" letter-spacing="2" fill="#c084fc">THE GOAL</text>
    </g>

    <text x="600" y="250" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#64748b">Develop  →  Version Control  →  Containerize  →  CI/CD  →  Cloud Deployment</text>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="267" rx="19" fill="none" stroke="url(#border)" stroke-width="2.5" stroke-dasharray="500 1100">
    <animate attributeName="stroke-dashoffset" from="0" to="-1600" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
